version: "3.8"

services:
  mariadb:
    image: mariadb:10.8
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123}
    volumes:
      - mariadb-data:/var/lib/mysql
    restart: unless-stopped

  redis:
    image: redis:alpine
    restart: unless-stopped

  frappe:
    image: frappe/bench:latest
    command: >
      bash -lc '
        set -e;

        export PATH="/home/frappe/.local/bin:${PATH}";
        export PATH="${NVM_DIR}/versions/node/v${NODE_VERSION_DEVELOP}/bin/:${PATH}";

        if ! command -v bench >/dev/null 2>&1; then
          echo "bench not found on PATH";
          echo "PATH=${PATH}";
          ls -la /home/frappe/.local/bin || true;
          exit 1;
        fi;

        if [ -d /home/frappe/frappe-bench/apps/frappe ]; then
          echo "Bench already exists, starting...";
          cd /home/frappe/frappe-bench;
          sed -i "s/serve --port 8000/serve --port 8082/g" Procfile || true;
          bench start;
        else
          echo "Creating new bench...";

          bench init --skip-redis-config-generation frappe-bench;
          cd frappe-bench;

          bench set-mariadb-host mariadb;
          bench set-redis-cache-host redis://redis:6379;
          bench set-redis-queue-host redis://redis:6379;
          bench set-redis-socketio-host redis://redis:6379;

          sed -i "/redis/d" ./Procfile;
          sed -i "/watch/d" ./Procfile;
          sed -i "s/serve --port 8000/serve --port 8082/g" ./Procfile;

          bench get-app payments;
          bench get-app lms https://github.com/frappe/lms;

          bench new-site lms.localhost \
            --force \
            --mariadb-root-password "${MYSQL_ROOT_PASSWORD:-123}" \
            --admin-password admin \
            --no-mariadb-socket;

          bench --site lms.localhost install-app payments;
          bench --site lms.localhost install-app lms;
          bench --site lms.localhost set-config developer_mode 1;
          bench --site lms.localhost clear-cache;
          bench use lms.localhost;

          bench start;
        fi
      '
    environment:
      SHELL: /bin/bash
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123}
    working_dir: /home/frappe
    volumes:
      - frappe-bench:/home/frappe/frappe-bench
    depends_on:
      - mariadb
      - redis
    ports:
      - "8082:8082"
      - "9000:9000"
    restart: unless-stopped

volumes:
  mariadb-data:
  frappe-bench:
